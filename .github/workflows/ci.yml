name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Named steps stay for readability; the command behind each lives in
      # the Makefile only (REPO-STANDARD.md) -- a hand-duplicated command
      # list here is exactly how phanspeed's CI went red for five commits
      # and sutra's went red on every commit since 0.1.0, both silently,
      # because nobody had to notice the Makefile and this file drifting
      # apart. If a check needs adding or changing, it changes in the
      # Makefile and this file is untouched.
      - name: Python compiles
        run: make check-py

      - name: Shell scripts parse + shellcheck
        run: make check-shell

      - name: check-sutra (vendored copy integrity)
        run: make check-sutra

      - name: Extension JS + metadata.json
        run: make check-js

      - name: Man pages render without warnings
        run: make check-man

      - name: Smoke (real daemon, real mounts, hostile socket input)
        run: make smoke

      - name: Attack (full cmd surface + oversized/garbage/nested/stall)
        run: make attack

      - name: Repo structure (REPO-STANDARD.md gate)
        run: make check-repo
